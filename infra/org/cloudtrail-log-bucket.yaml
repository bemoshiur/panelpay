AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PanelPay organization trail, part 1 of 2 (Sections 3.3 and 15 item 14): the KMS key and the S3
  log bucket. Deploy in the LOG ARCHIVE account (tc-log-archive, proposed in accounts-and-ous.md) in
  the Region of the trail (ap-southeast-1), BEFORE cloudtrail-trail.yaml. Nobody can delete a log
  object: the bucket policy denies delete to everyone, versions are kept and Object Lock holds them.
# VERIFY: CloudTrail delivery to a bucket with Object Lock, with SSE-KMS and with an organization
# trail: the bucket policy follows the documented form (aws:SourceArn of the trail;
# AWSLogs/<management account>/ and AWSLogs/<organization id>/ prefixes); the key policy got the
# documented kms:Decrypt for the S3 Bucket Key (WPU-Z11). Check with
# `aws cloudtrail get-trail-status` after the trail exists, and look for the first log file.
# VERIFY: COMPLIANCE retention cannot be shortened or removed by anyone, root included, until it
# expires, and the bucket cannot be emptied meanwhile. Pick the retention days with the owner (the audit
# period is not in the plan) before the first deploy.
# Detective control: alarm on s3:PutBucketPolicy / DeleteBucketPolicy / PutBucketObjectLockConfiguration
# on this bucket and on kms:ScheduleKeyDeletion / DisableKey / PutKeyPolicy on the trail key (EventBridge
# rule in this account to the on-call topic; not authored here). Run `aws cloudtrail validate-logs`
# regularly (digest files prove no log file was changed or removed). scps.yaml denies those calls too.
# VERIFY: aws:PrincipalServiceName is set for requests made by the CloudTrail service principal; check
# the first delivered log file after the Deny on PutObject below is in place.

Parameters:
  ManagementAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: Account that owns the organization trail. Entered by DevOps at deploy time.
  OrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
    Description: Id of the AWS Organization (o-xxxx). Not an account id.
  TrailName:
    Type: String
    Default: ticon-org-trail
  KeyAdminRoleArnPattern:
    Type: String
    Default: "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_TcOrgAdmin_*"
    Description: The one named admin role that may administer the trail key. Same role as AdminRoleArnPattern in scps.yaml.
  LogBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{2,62}$"
    Description: Globally unique bucket name chosen by DevOps.
  RetentionDays:
    Type: Number
    Default: 365
    MinValue: 90

Resources:
  TrailKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts the CloudTrail log files of the TiCON organization trail.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: KeyAdministrationByTheNamedAdminRoleOnly
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:root"
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  Ref: KeyAdminRoleArnPattern
            Action:
              - kms:Describe*
              - kms:Get*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Enable*
              - kms:Disable*
              - kms:Revoke*
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:Decrypt
            Resource: "*"
          - Sid: CloudTrailEncrypts
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn:
                  Fn::Sub: "arn:aws:cloudtrail:${AWS::Region}:${ManagementAccountId}:trail/${TrailName}"
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn:
                  Fn::Sub: "arn:aws:cloudtrail:*:${ManagementAccountId}:trail/${TrailName}"
          - Sid: CloudTrailDescribesKey
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:DescribeKey
            Resource: "*"
          # VERIFY result (WPU-Z11, CloudTrail "Configure AWS KMS key policies for CloudTrail"): with an
          # S3 Bucket Key (BucketKeyEnabled below) CloudTrail needs kms:Decrypt to create or update a trail
          # with SSE-KMS. The documented example (AllowCloudTrailDecryptTrail) has no condition; the same
          # page recommends aws:SourceArn as a security best practice, so the decrypt is scoped to this
          # trail (no confused deputy). No kms:EncryptionContext:aws:cloudtrail:arn condition here: with a
          # Bucket Key, S3 asks KMS with the bucket ARN as the encryption context, so that condition could
          # never match. VERIFY: prove it with `aws cloudtrail get-trail-status` (LatestDeliveryError
          # empty) and the first log file; if the decrypt is refused, read the KMS AccessDenied in CloudTrail
          # and change this condition by pull request, never by dropping it silently.
          - Sid: CloudTrailDecryptsForTheBucketKey
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn:
                  Fn::Sub: "arn:aws:cloudtrail:${AWS::Region}:${ManagementAccountId}:trail/${TrailName}"
  TrailKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/ticon-org-trail
      TargetKeyId:
        Ref: TrailKey

  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Ref: LogBucketName
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days:
              Ref: RetentionDays
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID:
                Fn::GetAtt:
                  - TrailKey
                  - Arn
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersionsAfterRetention
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays:
                Ref: RetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailChecksTheBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource:
              Fn::GetAtt:
                - LogBucket
                - Arn
            Condition:
              StringEquals:
                aws:SourceArn:
                  Fn::Sub: "arn:aws:cloudtrail:${AWS::Region}:${ManagementAccountId}:trail/${TrailName}"
          - Sid: CloudTrailWritesTheManagementAccountLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource:
              Fn::Sub: "${LogBucket.Arn}/AWSLogs/${ManagementAccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn:
                  Fn::Sub: "arn:aws:cloudtrail:${AWS::Region}:${ManagementAccountId}:trail/${TrailName}"
          - Sid: CloudTrailWritesTheMemberAccountLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource:
              Fn::Sub: "${LogBucket.Arn}/AWSLogs/${OrganizationId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn:
                  Fn::Sub: "arn:aws:cloudtrail:${AWS::Region}:${ManagementAccountId}:trail/${TrailName}"
          - Sid: DenyPolicyAndConfigurationChangesExceptTheAdminRole
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:PutBucketPolicy
              - s3:PutLifecycleConfiguration
              - s3:PutBucketVersioning
              - s3:PutBucketObjectLockConfiguration
            Resource:
              - Fn::GetAtt:
                  - LogBucket
                  - Arn
              - Fn::Sub: "${LogBucket.Arn}/*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn: "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_TcOrgAdmin_*"
          - Sid: DenyRetentionTamperingToEveryone
            Effect: Deny
            Principal: "*"
            Action:
              - s3:BypassGovernanceRetention
              - s3:PutObjectRetention
              - s3:PutObjectLegalHold
            Resource:
              Fn::Sub: "${LogBucket.Arn}/*"
          - Sid: DenyWritesExceptByTheCloudTrailService
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
            Resource:
              Fn::Sub: "${LogBucket.Arn}/AWSLogs/*"
            Condition:
              StringNotEquals:
                aws:PrincipalServiceName: cloudtrail.amazonaws.com
          - Sid: DenyDeleteToEveryoneIncludingAdmins
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource:
              Fn::Sub: "${LogBucket.Arn}/*"
          - Sid: DenyPlainHttp
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - Fn::GetAtt:
                  - LogBucket
                  - Arn
              - Fn::Sub: "${LogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  LogBucketName:
    Value:
      Ref: LogBucket
  TrailKeyArn:
    Description: Pass this to cloudtrail-trail.yaml (KmsKeyArn).
    Value:
      Fn::GetAtt:
        - TrailKey
        - Arn
