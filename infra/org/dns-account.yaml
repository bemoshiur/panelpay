AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PanelPay roles in tc-dns (Sections 6.3 and 12): TcDnsProvisioner, TcDnsReader and TcBillingReader,
  with one permissions boundary. Deploy with the DevOps admin role. Control plane stage: staging or
  production. Separate accounts: deploy once in tc-dns with CreateBillingReader=true. ONE account (owner
  ruling): deploy pool-roles.yaml first, then this with CreateBillingReader=false. No test-zone split yet.
# VERIFY result (WPU-Z11, docs/analysis/verify-review-2026-11-13.md): the adapters exist.
# packages/aws/adapters/route53-client.ts calls ChangeResourceRecordSets, CreateHostedZone,
# DeleteHostedZone, GetHostedZone, ListHostedZonesByName and ListResourceRecordSets;
# packages/aws/domains-client.ts calls CheckDomainAvailability, GetContactReachabilityStatus (inside every
# getDomainDetail), GetDomainDetail, GetOperationDetail, ListPrices, RegisterDomain, RenewDomain,
# ResendContactReachabilityEmail and UpdateDomainNameservers. The two policies below list them;
# route53:GetChange stays for the INSYNC poll that JOURNEY.md plans (tests/repo/infra-org.test.mjs pins it).
# VERIFY result: RegisterDomain is authorized by route53domains:RegisterDomain and route53:CreateHostedZone
# (AWS service reference); GetHostedZone and ListHostedZonesByName stay for route53-client.ts. Confirm
# with the first real registration in this account, from the AccessDenied entries of CloudTrail.
# VERIFY: Route 53 Domains and Route 53 API calls are served from us-east-1, so the Region condition
# below is us-east-1 only.

# SECURITY NOTE (automated review, 2026-11-13): ControlPlaneStage=staging exists ONLY for the one-account
# setup of the owner, where the staging stage and the DNS role live in the same small test account. Never
# deploy a staging-trusted copy of this stack into a real, separate customer DNS account (tc-dns of the
# three-account design): its roles can change and delete any hosted zone of the account, so a staging
# function role must not be trusted there. In a multi-account setup keep ControlPlaneStage=production.
Parameters:
  ControlPlaneAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: tc-platform (production). Entered by DevOps at deploy time; never written into this repository.
  ExternalId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9+=,.@:/_-]{16,1224}$"
    Description: The ExternalId of tc-dns, the same plain value as pool_accounts.external_id.
  ControlPlaneStage:
    Type: String
    AllowedValues: [staging, production]
    Default: production
    Description: >-
      The SST stage of the control plane (staging trusts the tc-staging-* function roles, production the
      tc-production-* ones, never both). The function roles it creates are named
      tc-<stage>-<function>-role (infra/lib/stage.ts roleName), so the trust below names them exactly.
  CreateBillingReader:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      "true" (default, separate tc-dns account) creates TcBillingReader here. In ONE account shared with
      the pool roles, pool-roles.yaml already owns TcBillingReader (its ce:GetCostAndUsage on Resource "*"
      covers the whole account, Route 53 included): deploy pool-roles.yaml first, then this stack with
      "false", or the second stack fails on the duplicate role name.
  MaxSessionSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 3600

Conditions:
  CreateBillingReaderRole:
    Fn::Equals:
      - Ref: CreateBillingReader
      - "true"

Resources:
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: TcDnsPermissionsBoundary
      Description: Ceiling for every Tc role of tc-dns.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Route53AndDomainsOnly
            Effect: Allow
            Action:
              - route53:*
              - route53domains:*
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
          - Sid: BillingRead
            Effect: Allow
            Action:
              - ce:GetCostAndUsage
            Resource: "*"
          - Sid: NeverAllowed
            Effect: Deny
            Action:
              - route53domains:TransferDomain
              - route53domains:TransferDomainToAnotherAwsAccount
              - route53domains:AcceptDomainTransferFromAnotherAwsAccount
              - route53domains:DeleteDomain
              - route53domains:DisableDomainTransferLock
              - route53domains:RetrieveDomainAuthCode
              - route53:CreateVPCAssociationAuthorization
              - route53:AssociateVPCWithHostedZone
            Resource: "*"
          - Sid: NoIamNoKeys
            Effect: Deny
            Action:
              - iam:*
              - sts:GetSessionToken
            Resource: "*"

  TcDnsProvisioner:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcDnsProvisioner
      Description: Hosted zones, records and domain registrations. Assumed by the provisioner function only.
      MaxSessionDuration:
        Ref: MaxSessionSeconds
      PermissionsBoundary:
        Ref: PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ProvisionerFunctionOfTheControlPlane
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:role/tc-${ControlPlaneStage}-provisioner-role"
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: Route53Provisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: HostedZonesAndRecords
                Effect: Allow
                Action:
                  - route53:CreateHostedZone
                  - route53:GetHostedZone
                  - route53:ListHostedZonesByName
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:DeleteHostedZone
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: DomainRegistration
                Effect: Allow
                Action:
                  - route53domains:CheckDomainAvailability
                  # WPU-Z19: an AVAILABLE answer without a price type is decided by GetDomainPrices of the name
                  # (registry premium pricing, verify review 2026-11-13).
                  - route53domains:GetDomainPrices
                  - route53domains:GetContactReachabilityStatus
                  - route53domains:ListPrices
                  - route53domains:RegisterDomain
                  - route53domains:GetOperationDetail
                  - route53domains:RenewDomain
                  - route53domains:GetDomainDetail
                  - route53domains:ResendContactReachabilityEmail
                  - route53domains:UpdateDomainNameservers
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: ExplicitDeny
                Effect: Deny
                Action:
                  - route53domains:TransferDomain
                  - route53domains:TransferDomainToAnotherAwsAccount
                  - route53domains:AcceptDomainTransferFromAnotherAwsAccount
                  - route53domains:DeleteDomain
                  - route53domains:DisableDomainTransferLock
                  - route53domains:RetrieveDomainAuthCode
                Resource: "*"

  TcDnsReader:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcDnsReader
      Description: Read-only Route 53 and Route 53 Domains. Assumed by reader, catalog-sync and reconciler.
      MaxSessionDuration:
        Ref: MaxSessionSeconds
      PermissionsBoundary:
        Ref: PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadersOfTheControlPlane
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  - Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:role/tc-${ControlPlaneStage}-reader-role"
                  - Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:role/tc-${ControlPlaneStage}-catalog-sync-role"
                  - Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:role/tc-${ControlPlaneStage}-reconciler-role"
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: Route53Read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListedReadsOnly
                Effect: Allow
                Action:
                  - route53domains:CheckDomainAvailability
                  - route53domains:GetDomainSuggestions
                  - route53domains:ListPrices
                  - route53domains:GetDomainDetail
                  - route53domains:GetContactReachabilityStatus
                  - route53domains:ListDomains
                  - route53:ListHostedZones
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1

  TcBillingReader:
    Type: AWS::IAM::Role
    Condition: CreateBillingReaderRole
    Properties:
      RoleName: TcBillingReader
      Description: Cost of tc-dns only. Assumed by the reconciler.
      MaxSessionDuration:
        Ref: MaxSessionSeconds
      PermissionsBoundary:
        Ref: PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReconcilerOfTheControlPlane
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::Sub: "arn:aws:iam::${ControlPlaneAccountId}:role/tc-${ControlPlaneStage}-reconciler-role"
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: CostRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CostAndUsage
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: "*"

Outputs:
  RoleNames:
    Description: Names only. The platform builds the ARN from the account id in pool_accounts.
    Value:
      Fn::If:
        - CreateBillingReaderRole
        - TcDnsProvisioner,TcDnsReader,TcBillingReader
        - TcDnsProvisioner,TcDnsReader
