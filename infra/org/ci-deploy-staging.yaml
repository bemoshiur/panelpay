AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PanelPay CI role TcCiDeployStaging and its permissions boundary TcCiRoleBoundaryStaging. Assumed through GitHub OIDC by the staging deploy job only (aud, sub = environment staging, job_workflow_ref on the protected branch). Changes the staging stage only, also in an account shared with production. Full notes are in the comments at the top of this file.
# Description (moved from the Description field: CloudFormation allows at most 1024 characters):
# PanelPay CI role TcCiDeployStaging (R3, B.1 of docs/analysis/pending-audit.md) and the permissions
# boundary TcCiRoleBoundaryStaging that every role it creates must carry. Assumed by the job `deploy` of
# .github/workflows/deploy-staging.yml (and the job `remove` of remove-staging.yml) through GitHub OIDC. The
# trust is the three conditions those workflows document: aud, sub = the GitHub environment `staging`, and
# job_workflow_ref = one of the two workflows on the protected branch (StringEquals on a list: either). A pull request, a fork or any other workflow cannot assume it. Deployed by
# scripts/golive/ci-roles.sh (or the DevOps admin role). The role needs the account's GitHub OIDC provider
# but not the stack of ci-oidc-provider.yaml: the provider ARN is built from the account and the fixed host,
# so a provider that other projects already created serves too (one per account and URL).
# The organisation, the repository and their ids are parameters; no account id or name is written here.
# ONE ACCOUNT (owner decision 2026-11-13): staging and production may share the account. Every fixed name
# here is unique to staging (TcCiRoleBoundaryStaging, TcCiDeployStaging), every IAM write is limited to the
# names of the staging stage (tc-staging-*, tryaws-now-staging-*), and the last statements deny every
# action on the production stage: on what SST tags sst:stage=production, on the production names, on the
# SST state and passphrase of production, and on any DNS record outside the two staging domains.
# PRIVILEGE ESCALATION GUARD: the role can create, change and pass only roles named tc-staging-* (the
# function and platform roles of infra/lib/stage.ts roleName) and tryaws-now-staging-* (the roles SST names
# itself), and only when the role carries the boundary below (infra/app.ts attaches it to every role); it
# can attach only the listed AWS managed policies; it can pass a role only to the listed services; it can
# never remove or replace the boundary, change the boundary policy, touch the CI roles, mint users or keys,
# or change CloudTrail, GuardDuty or the organization. A compromised deploy job therefore cannot make itself
# or any role an administrator.
# VERIFY: IAM evaluates the GitHub claim `job_workflow_ref` as the condition key
# token.actions.githubusercontent.com:job_workflow_ref (current IAM documentation, "Configure a role for
# GitHub OIDC identity provider"). Its value has NO "repo:" prefix: <org>/<repo>/.github/workflows/<file>@<ref>.
# If the key is not evaluated the condition never matches and the role fails closed (R16).
# VERIFY result (WPU-Z11, GitHub OIDC reference and changelog 2026-04-23): a repository created, renamed or
# transferred after 2026-07-15 gets the immutable subject repo:<org>@<owner-id>/<repo>@<repo-id>:... ; the
# owner and repository ids are always in it. This repository is past the cut-off, so the sub below is
# repo:<org>@<owner-id>/<repo>@<repo-id>:environment:staging. GitHub documents the environment form only by
# inference from the branch example: confirm the subject in the first AssumeRoleWithWebIdentity event of
# CloudTrail.
# VERIFY: the boundary may be too tight for the first staging deploy (SST creates roles for the Next.js
# server and image functions, the RDS proxy, the Cron scheduler, the NAT instance and the CloudFront edge
# function). Run the first staging deploy, read the AccessDenied in the role's CloudTrail, widen the boundary
# by pull request (never remove the Deny statements) and record it in JOURNEY.md.
# VERIFY: SST 4.17.2 names an unnamed role tryaws-now-<stage>-<logical name>-<random> only while the logical
# name has at most 36 characters on staging (33 on production; WPU-Y6: the app name tryaws-now is one
# character shorter than before): longer names lose the app name
# (components/naming.ts prefixName). The roles of infra/stacks have fixed names (tc-<stage>-<part>-role);
# infra/stacks/web.ts gives the two ISR revalidation subscriber roles fixed names too; every other role SST
# creates today has a short logical name (read in the SST sources). Check the role names after the first
# deploy.
# VERIFY: iam:PermissionsBoundary is evaluated for CreateRole, PutRolePolicy, AttachRolePolicy,
# DetachRolePolicy, DeleteRolePolicy and PutRolePermissionsBoundary (IAM documentation "Delegate
# permissions management to others by using permissions boundaries"); UpdateAssumeRolePolicy is
# included here as a precaution, and is checked by the same condition key only if AWS evaluates it.
# VERIFY: the AWS managed policies and the PassedToService values are what SST attaches and passes today:
# AWSLambdaBasicExecutionRole and AWSLambdaVPCAccessExecutionRole (functions), AmazonSSMManagedInstanceCore and
# ec2.amazonaws.com (the NAT instance of a lean stage, components/aws/vpc.ts), lambda, edgelambda, rds and
# scheduler. AWSLambdaSQSQueueExecutionRole and events.amazonaws.com are not used by SST 4.17.2 (kept; a later
# pull request may drop them).
# VERIFY: SST tags every resource it creates with sst:app and sst:stage (default tags of its AWS provider,
# platform/src/components/aws/helpers/provider.ts). The tag-based Deny below relies on it; where a service
# does not evaluate aws:ResourceTag for an action, the name-based Deny is the remaining guard.
# KNOWN ONE-ACCOUNT RESIDUALS (WPU-Z11 review, Needs decision): this role is NOT confined to its stage for
# (1) CloudFront distributions, the response headers policy tc-<stage>-security-headers and KeyValueStores:
# cloudfront:* and the KeyValueStore actions are on "*" and key-value-store/*; their ARNs carry random ids, and whether CloudFront evaluates
# aws:ResourceTag/sst:stage for distribution actions is a VERIFY (the tag Deny guards them if it does; a
# KeyValueStore takes no tags); (2) ACM certificates (random ids; guarded only by the tag Deny, VERIFY that
# SST tags them and ACM evaluates the tag); (3) SES: ses:* on "*" reaches the identity tryaws.now that both
# stages share; (4) the shared SST asset bucket sst-asset-*: function code objects have keys without the
# stage (assets/<name>-code-<hash>.zip), so either deploy role can overwrite the code the other stage
# deploys. WAF web ACLs and IP sets are named tc-<stage>-* and denied by name; CloudFront Functions by name
# (VERIFY the names). Separate accounts remove these residuals.
# VERIFY: the KvKeys provider of SST (CloudFront KeyValueStore of the Next.js sites) needs exactly
# DescribeKeyValueStore, ListKeys and UpdateKeys; the budget of a lean stage needs the five budgets actions
# below (tags on create need budgets:TagResource, Service Authorization Reference of AWS Budgets).

Parameters:
  GitHubOrg:
    Type: String
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,38}$"
    Description: GitHub organisation or user that owns the repository.
  GitHubOwnerId:
    Type: String
    AllowedPattern: "^[0-9]{1,20}$"
    Description: >-
      The numeric id of the owner (gh api repos/<org>/<repo> --jq .owner.id). Part of the immutable OIDC
      subject that GitHub signs for this repository.
  GitHubRepo:
    Type: String
    AllowedPattern: "^[A-Za-z0-9._-]{1,100}$"
    Description: GitHub repository name.
  GitHubRepoId:
    Type: String
    AllowedPattern: "^[0-9]{1,20}$"
    Description: The numeric id of the repository (gh api repos/<org>/<repo> --jq .id).
  ProtectedBranch:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9._-]{1,100}$"
    Description: >-
      The protected branch deploy-staging.yml runs from (A.26 of the audit decides the name). The role
      is assumed only by that workflow at that ref.
  WebDomain:
    Type: String
    AllowedPattern: "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
    Description: >-
      TC_DOMAIN_WEB of the staging environment. The role may change only the DNS records of this name, of
      the admin name and below them (the zone may hold production records too).
  AdminDomain:
    Type: String
    AllowedPattern: "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
    Description: TC_DOMAIN_ADMIN of the staging environment.
  MaxSessionSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 3600
    Description: One hour, as role-duration-seconds in the workflow.

Resources:
  TcCiRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: TcCiRoleBoundaryStaging
      Description: >-
        The most a role created by the TiCON CI deploy role may ever do. No IAM, no organization, no
        CloudTrail change, no assume of a role other than the pool and DNS roles (Tc*).
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RuntimeOfTheStackFunctions
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
              - cloudwatch:PutMetricData
              - cognito-idp:Admin*
              - cognito-idp:ListUsers
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
              - ec2:AssignPrivateIpAddresses
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:UnassignPrivateIpAddresses
              - events:PutEvents
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - lambda:InvokeFunction
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - rds-db:connect
              - s3:DeleteObject
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - secretsmanager:GetSecretValue
              - ses:SendEmail
              - ses:SendRawEmail
              - sns:Publish
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ReceiveMessage
              - sqs:SendMessage
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: "*"
          - Sid: AssumeOnlyThePoolAndDnsRoles
            Effect: Allow
            Action: sts:AssumeRole
            Resource: "arn:aws:iam::*:role/Tc*"
          - Sid: NeverIdentityOrganisationOrTheAuditTrail
            Effect: Deny
            Action:
              - iam:*
              - organizations:*
              - account:*
              - cloudtrail:*
              - guardduty:*
            Resource: "*"
          # ONE ACCOUNT (WPU-Z11, security review): the Allow above is on "*" because SST names many
          # resources itself; these two Deny statements keep a role of the staging stage away from the
          # data, secrets and functions of the production stage that shares the account: what SST tags
          # sst:stage=production (KMS keys, tables, queues, topics, secrets, functions), and the production names
          # where a service does not evaluate resource tags (S3 objects, SSM parameters, the SST state).
          # Separate accounts remain the stronger isolation (docs/runbooks/go-live.md).
          - Sid: NeverWhatSstTaggedForTheOtherStage
            Effect: Deny
            Action: "*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/sst:stage: production
          - Sid: NeverANameOfTheOtherStage
            Effect: Deny
            Action: "*"
            Resource:
              - arn:aws:s3:::tryaws-now-production-*
              - arn:aws:s3:::sst-state-*/*/tryaws-now/production*
              - Fn::Sub: "arn:aws:ssm:*:${AWS::AccountId}:parameter/sst/passphrase/tryaws-now/production"
              - Fn::Sub: "arn:aws:ssm:*:${AWS::AccountId}:parameter/sst/tryaws-now/production/*"
              - Fn::Sub: "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:tryaws-now-production-*"
              - Fn::Sub: "arn:aws:dynamodb:*:${AWS::AccountId}:table/tryaws-now-production-*"
              - Fn::Sub: "arn:aws:sqs:*:${AWS::AccountId}:tryaws-now-production-*"
              - Fn::Sub: "arn:aws:sns:*:${AWS::AccountId}:tryaws-now-production-*"
              - Fn::Sub: "arn:aws:sns:*:${AWS::AccountId}:tc-production-*"
              - Fn::Sub: "arn:aws:lambda:*:${AWS::AccountId}:function:tc-production-*"
              - Fn::Sub: "arn:aws:lambda:*:${AWS::AccountId}:function:tryaws-now-production-*"
              - Fn::Sub: "arn:aws:kms:*:${AWS::AccountId}:alias/tc-production-*"
              - Fn::Sub: "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/tc-production-*"
              - Fn::Sub: "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/tryaws-now-production-*"
  TcCiDeployStaging:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcCiDeployStaging
      Description: Deploys the staging stage of the SST app. Assumed by GitHub Actions through OIDC only.
      MaxSessionDuration:
        Ref: MaxSessionSeconds
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubStagingEnvironmentOnly
            Effect: Allow
            Principal:
              Federated:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: "repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:staging"
                # WPU-Z11: the two staging workflows, each at the protected branch: deploy and remove.
                token.actions.githubusercontent.com:job_workflow_ref:
                  - Fn::Sub: "${GitHubOrg}/${GitHubRepo}/.github/workflows/deploy-staging.yml@refs/heads/${ProtectedBranch}"
                  - Fn::Sub: "${GitHubOrg}/${GitHubRepo}/.github/workflows/remove-staging.yml@refs/heads/${ProtectedBranch}"
      Policies:
        - PolicyName: SstDeployOfTheStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ServicesOfTheStack
                Effect: Allow
                Action:
                  - acm:*
                  - cloudfront:*
                  - cloudwatch:*
                  - cognito-idp:*
                  - dynamodb:*
                  - ec2:*
                  - events:*
                  - kms:*
                  - lambda:*
                  - logs:*
                  - rds:*
                  - route53:ChangeResourceRecordSets
                  - route53:Get*
                  - route53:List*
                  - s3:*
                  - scheduler:*
                  - secretsmanager:*
                  - ses:*
                  - sns:*
                  - sqs:*
                  - ssm:*
                  - wafv2:*
                Resource: "*"
              - Sid: KeyValueStoresOfTheSites
                Effect: Allow
                Action:
                  - cloudfront-keyvaluestore:DescribeKeyValueStore
                  - cloudfront-keyvaluestore:ListKeys
                  - cloudfront-keyvaluestore:UpdateKeys
                Resource:
                  Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:key-value-store/*"
              # SST's Vpc always creates a Cloud Map private DNS namespace (about 0.50 USD a month); the staging deploy
              # of 2026-11-14 stopped at servicediscovery:CreatePrivateDnsNamespace. Scoped by the sst:stage tag that
              # SST puts on the create request and the namespace (checked in CloudTrail and with ListTagsForResource
              # on 2026-11-14). Cloud Map then creates the private hosted zone itself (CloudTrail: the internal
              # CreateServiceLinkedPrivateHostedZone, invoked by servicediscovery.amazonaws.com); Route 53 zone
              # creation is allowed only through an AWS service, never as a direct call, and never a delete.
              - Sid: CloudMapRead
                Effect: Allow
                Action:
                  - servicediscovery:GetNamespace
                  - servicediscovery:GetOperation
                  - servicediscovery:ListNamespaces
                  - servicediscovery:ListOperations
                  - servicediscovery:ListTagsForResource
                Resource: "*"
              - Sid: CloudMapCreateForTheStage
                Effect: Allow
                Action: servicediscovery:CreatePrivateDnsNamespace
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/sst:stage: staging
              - Sid: CloudMapChangeOnlyTheStageNamespaces
                Effect: Allow
                Action:
                  - servicediscovery:DeleteNamespace
                  - servicediscovery:TagResource
                  - servicediscovery:UntagResource
                  - servicediscovery:UpdatePrivateDnsNamespace
                Resource:
                  Fn::Sub: "arn:aws:servicediscovery:*:${AWS::AccountId}:namespace/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/sst:stage: staging
              - Sid: PrivateHostedZoneOnlyThroughCloudMap
                Effect: Allow
                Action:
                  - route53:CreateHostedZone
                  - route53:CreateServiceLinkedPrivateHostedZone
                Resource: "*"
                Condition:
                  Bool:
                    aws:ViaAWSService: "true"
              - Sid: BudgetOfTheStage
                Effect: Allow
                Action:
                  - budgets:ListTagsForResource
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ViewBudget
                Resource:
                  Fn::Sub: "arn:aws:budgets::${AWS::AccountId}:budget/tc-staging-*"
              - Sid: ReadRolesOfTheStack
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                Resource:
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tc-staging-*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tryaws-now-staging-*"
              - Sid: ReadTheRdsServiceLinkedRole
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/rds.amazonaws.com/AWSServiceRoleForRDS"
              - Sid: CreateAndChangeRolesOnlyWithTheBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tc-staging-*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tryaws-now-staging-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary:
                      Fn::Sub: "arn:aws:iam::${AWS::AccountId}:policy/TcCiRoleBoundaryStaging"
              - Sid: AttachOnlyTheListedManagedPolicies
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource:
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tc-staging-*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tryaws-now-staging-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary:
                      Fn::Sub: "arn:aws:iam::${AWS::AccountId}:policy/TcCiRoleBoundaryStaging"
                    iam:PolicyARN:
                      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
              - Sid: ChangeAndDeleteTheirOwnRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource:
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tc-staging-*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tryaws-now-staging-*"
              - Sid: InstanceProfilesOfTheStage
                Effect: Allow
                Action:
                  - iam:AddRoleToInstanceProfile
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:ListInstanceProfileTags
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:instance-profile/tc-staging-*"
              - Sid: PassOnlyToTheServicesThatRunTheStack
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tc-staging-*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tryaws-now-staging-*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ec2.amazonaws.com
                      - edgelambda.amazonaws.com
                      - events.amazonaws.com
                      - lambda.amazonaws.com
                      - rds.amazonaws.com
                      - scheduler.amazonaws.com
              - Sid: ServiceLinkedRolesOnly
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/*"
              - Sid: NeverRemoveOrReplaceTheBoundary
                Effect: Deny
                Action:
                  - iam:DeleteRolePermissionsBoundary
                  - iam:DeleteUserPermissionsBoundary
                  - iam:PutUserPermissionsBoundary
                Resource: "*"
              - Sid: NeverAnotherBoundary
                Effect: Deny
                Action: iam:PutRolePermissionsBoundary
                Resource: "*"
                Condition:
                  StringNotEquals:
                    iam:PermissionsBoundary:
                      Fn::Sub: "arn:aws:iam::${AWS::AccountId}:policy/TcCiRoleBoundaryStaging"
              - Sid: NeverChangeTheBoundaryPolicyItself
                Effect: Deny
                Action:
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:policy/TcCiRoleBoundaryStaging"
              - Sid: NeverTheCiRolesNorTheProviderNorUsers
                Effect: Deny
                Action: iam:*
                Resource:
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/TcCi*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:oidc-provider/*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:user/*"
              - Sid: NoLongLivedKeysNoOrganisationNoAuditChange
                Effect: Deny
                Action:
                  - iam:AttachUserPolicy
                  - iam:CreateAccessKey
                  - iam:CreateLoginProfile
                  - iam:CreateUser
                  - iam:PutUserPolicy
                  - iam:UpdateAccessKey
                  - iam:UpdateLoginProfile
                  - organizations:*
                  - account:*
                  - cloudtrail:AddTags
                  - cloudtrail:CreateTrail
                  - cloudtrail:DeleteTrail
                  - cloudtrail:PutEventSelectors
                  - cloudtrail:PutInsightSelectors
                  - cloudtrail:RemoveTags
                  - cloudtrail:StartLogging
                  - cloudtrail:StopLogging
                  - cloudtrail:UpdateTrail
                  - guardduty:Delete*
                  - guardduty:Disable*
                  - guardduty:Disassociate*
                  - guardduty:Stop*
                  - guardduty:Update*
                Resource: "*"
              - Sid: NeverAssumeAPoolOrDnsRole
                Effect: Deny
                Action: sts:AssumeRole
                Resource: "arn:aws:iam::*:role/Tc*"
              - Sid: NeverWhatSstTaggedForTheOtherStage
                Effect: Deny
                Action: "*"
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/sst:stage: production
              - Sid: NeverCreateForTheOtherStage
                Effect: Deny
                Action: "*"
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/sst:stage: production
              - Sid: NeverANameOfTheOtherStage
                Effect: Deny
                Action: "*"
                Resource:
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tc-production-*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:instance-profile/tc-production-*"
                  - Fn::Sub: "arn:aws:lambda:*:${AWS::AccountId}:function:tc-production-*"
                  - Fn::Sub: "arn:aws:lambda:*:${AWS::AccountId}:function:tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/tc-production-*"
                  - Fn::Sub: "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/tryaws-now-production-*"
                  - arn:aws:s3:::tryaws-now-production-*
                  - arn:aws:s3:::sst-state-*/*/tryaws-now/production*
                  - Fn::Sub: "arn:aws:ssm:*:${AWS::AccountId}:parameter/sst/passphrase/tryaws-now/production"
                  - Fn::Sub: "arn:aws:ssm:*:${AWS::AccountId}:parameter/sst/tryaws-now/production/*"
                  - Fn::Sub: "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:sqs:*:${AWS::AccountId}:tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:sns:*:${AWS::AccountId}:tc-production-*"
                  - Fn::Sub: "arn:aws:dynamodb:*:${AWS::AccountId}:table/tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:rds:*:${AWS::AccountId}:db:tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:rds:*:${AWS::AccountId}:snapshot:tc-production-*"
                  - Fn::Sub: "arn:aws:scheduler:*:${AWS::AccountId}:schedule/*/tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:cloudwatch:*:${AWS::AccountId}:alarm:tc-production-*"
                  - Fn::Sub: "arn:aws:kms:*:${AWS::AccountId}:alias/tc-production-*"
                  - Fn::Sub: "arn:aws:budgets::${AWS::AccountId}:budget/tc-production-*"
                  # VERIFY (fix round 1): SST names a CloudFront Function with physicalName(64), which is
                  # tryaws-now-<stage>-<name>-<random> or, when the app name is cut, <app part>-<stage>-<name>
                  # (components/naming.ts prefixName); both match the two patterns below for the names of
                  # infra/stacks today. Check the function names after the first deploy.
                  - Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:function/tryaws-now-production-*"
                  - Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:function/*-production-*"
                  # The WAF web ACL and IP sets of infra/stacks/waf.ts are named tc-<stage>-* (resourceName).
                  - Fn::Sub: "arn:aws:wafv2:*:${AWS::AccountId}:*/webacl/tc-production-*"
                  - Fn::Sub: "arn:aws:wafv2:*:${AWS::AccountId}:*/ipset/tc-production-*"
              # The SST bootstrap is SHARED by both stages of the account (/sst/bootstrap, the state bucket
              # sst-state-*, the asset bucket sst-asset-*). A deploy role uses them but must not change or
              # remove them; after an SST upgrade one SST command with administrator credentials bootstraps
              # again (docs/runbooks/go-live.md). Only bucket-level actions are denied here: object access in the shared
              # asset bucket is known residual (4) above (function code keys carry no stage).
              - Sid: NeverTheSharedSstBootstrap
                Effect: Deny
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:DeleteParameters
                  - ssm:LabelParameterVersion
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                Resource:
                  Fn::Sub: "arn:aws:ssm:*:${AWS::AccountId}:parameter/sst/bootstrap"
              - Sid: NeverTheSharedSstBuckets
                Effect: Deny
                Action:
                  - s3:PutBucket*
                  - s3:DeleteBucket*
                  - s3:PutLifecycleConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:PutReplicationConfiguration
                Resource:
                  - arn:aws:s3:::sst-state-*
                  - arn:aws:s3:::sst-asset-*
              # WPU-Z11 fix round 2: the name-based object denies must not be bypassed through an S3 access
              # point (its ARN names the access point, not the bucket). SST 4.17.2 and infra/stacks create
              # no S3 access point (only efs.AccessPoint exists in SST, unused here).
              - Sid: NeverCreateAnS3AccessPoint
                Effect: Deny
                Action:
                  - s3:CreateAccessPoint
                  - s3:CreateAccessPointForObjectLambda
                  - s3:CreateMultiRegionAccessPoint
                Resource: "*"
              - Sid: NeverUseAnS3AccessPoint
                Effect: Deny
                Action: s3:*
                Resource: "*"
                Condition:
                  "Null":
                    s3:DataAccessPointArn: "false"
              - Sid: OnlyTheDnsRecordsOfTheStage
                Effect: Deny
                Action: route53:ChangeResourceRecordSets
                Resource: "*"
                Condition:
                  ForAnyValue:StringNotLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - Ref: WebDomain
                      - Fn::Sub: "*.${WebDomain}"
                      - Ref: AdminDomain
                      - Fn::Sub: "*.${AdminDomain}"
