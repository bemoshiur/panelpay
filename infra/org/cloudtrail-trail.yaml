AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PanelPay organization trail, part 2 of 2 (Sections 3.3 and 15 item 14): one trail, all accounts of
  the organization, all approved Regions plus global events, log file validation on, SSE-KMS. Deploy in
  the MANAGEMENT account (or in a CloudTrail delegated administrator account, see VERIFY), in the home
  Region of the trail (ap-southeast-1), AFTER cloudtrail-log-bucket.yaml. Trusted access for CloudTrail
  must be enabled in the organization first (accounts-and-ous.md, step 6).
# VERIFY: IsOrganizationTrail needs the management account or a delegated administrator, and
# `aws organizations enable-aws-service-access --service-principal cloudtrail.amazonaws.com`.
# VERIFY: the bucket and key policies of cloudtrail-log-bucket.yaml name this trail's ARN; use the same
# TrailName and the same Region, or delivery fails with InsufficientS3BucketPolicyException.
# VERIFY: management events only. S3 data events and CloudTrail Insights cost extra; the owner decides.

Parameters:
  TrailName:
    Type: String
    Default: ticon-org-trail
  LogBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{2,62}$"
    Description: LogBucketName output of cloudtrail-log-bucket.yaml.
  KmsKeyArn:
    Type: String
    AllowedPattern: "^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36}$"
    Description: TrailKeyArn output of cloudtrail-log-bucket.yaml.

Resources:
  OrganizationTrail:
    Type: AWS::CloudTrail::Trail
    Properties:
      TrailName:
        Ref: TrailName
      S3BucketName:
        Ref: LogBucketName
      KMSKeyId:
        Ref: KmsKeyArn
      IsLogging: true
      IsOrganizationTrail: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true

Outputs:
  TrailArn:
    Value:
      Fn::GetAtt:
        - OrganizationTrail
        - Arn
