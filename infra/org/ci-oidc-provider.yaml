AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PanelPay GitHub OIDC identity provider (R3: CI holds no AWS key). An account can hold only one
  provider for this URL, and the three CI role templates build its ARN from the account and the host, so
  they work with a provider that exists already (created by hand or by another project). Deploy this
  template only when `aws iam list-open-id-connect-providers` shows none for
  token.actions.githubusercontent.com (scripts/golive/ci-roles.sh checks it). In ONE account shared by
  staging and production the provider is deployed at most once.
# VERIFY: AWS ignores ThumbprintList for token.actions.githubusercontent.com (it validates the
# certificate chain with its own trusted CAs), so no thumbprint is written. Check the current IAM
# documentation for "Create an OpenID Connect (OIDC) identity provider" before the first deploy.
# VERIFY: the audience (ClientIdList) must equal the `audience` of aws-actions/configure-aws-credentials
# (default sts.amazonaws.com), which the workflows in .github/workflows use.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

Outputs:
  OidcProviderName:
    Description: Host and path of the provider; the three CI role templates build its ARN from it.
    Value: token.actions.githubusercontent.com
