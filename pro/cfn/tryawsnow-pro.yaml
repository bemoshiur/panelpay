# Generated by pro/cfn/build-template.mjs from infra/org/pool-roles.yaml and dns-account.yaml.
# Do not edit: change the generator or the source templates, then run it.
AWSTemplateFormatVersion: "2010-09-09"
Description: "TryAWS.now Pro by TiCON System Limited: one EC2 instance, its IAM roles and two Cognito user pools in your account. Built by pro/cfn/build-template.mjs; do not edit by hand."
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Your domains
        Parameters:
          - PanelDomain
          - AdminDomain
      - Label:
          default: Operator
        Parameters:
          - OperatorEmail
          - OperatorCidr
          - KeyName
      - Label:
          default: Instance and network
        Parameters:
          - ImageId
          - InstanceType
          - RootVolumeGiB
          - VpcId
          - SubnetId
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: The TryAWS.now Pro AMI (AWS Marketplace fills this in).
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3a.small
      - t3a.medium
      - t3a.large
      - m6i.large
      - m7i.large
    Description: t3.medium is recommended; t3.small is the minimum.
  RootVolumeGiB:
    Type: Number
    Default: 30
    MinValue: 16
    MaxValue: 500
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC of the subnet below.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A PUBLIC subnet (route to an internet gateway) in that VPC.
  PanelDomain:
    Type: String
    AllowedPattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
    Description: Domain of the customer panel, e.g. panel.example.com
  AdminDomain:
    Type: String
    AllowedPattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
    Description: Domain of the operator app, e.g. ops.example.com
  OperatorEmail:
    Type: String
    AllowedPattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}$
    Description: First operator; Cognito e-mails a temporary password here. Also the Let's Encrypt contact.
  OperatorCidr:
    Type: String
    AllowedPattern: ^(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}/([0-9]|[12][0-9]|3[0-2])$
    Description: "Your office IP as a CIDR (e.g. 203.0.113.7/32): SSH and the operator app allow only this."
  KeyName:
    Type: String
    Default: ""
    Description: "Optional EC2 key pair for SSH. Empty: no key (use EC2 Instance Connect or none)."
Conditions:
  HasKeyName:
    Fn::Not:
      - Fn::Equals:
          - Ref: KeyName
          - ""
Resources:
  PoolBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Ceiling for every Tc role of a pool account. Identity policies enumerate the actions.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LightsailInApprovedRegionsOnly
            Effect: Allow
            Action:
              - lightsail:*
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - ap-southeast-1
                  - ap-south-1
                  - us-east-1
          - Sid: BillingRead
            Effect: Allow
            Action:
              - ce:GetCostAndUsage
            Resource: "*"
          - Sid: NeverAllowed
            Effect: Deny
            Action:
              - lightsail:DownloadDefaultKeyPair
              - lightsail:PeerVpc
              - lightsail:UnpeerVpc
              - lightsail:ExportSnapshot
              - lightsail:CreateCloudFormationStack
            Resource: "*"
          - Sid: NoIamNoKeys
            Effect: Deny
            Action:
              - iam:*
              - sts:GetSessionToken
            Resource: "*"
  DnsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Ceiling for every Tc role of tc-dns.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Route53AndDomainsOnly
            Effect: Allow
            Action:
              - route53:*
              - route53domains:*
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
          - Sid: BillingRead
            Effect: Allow
            Action:
              - ce:GetCostAndUsage
            Resource: "*"
          - Sid: NeverAllowed
            Effect: Deny
            Action:
              - route53domains:TransferDomain
              - route53domains:TransferDomainToAnotherAwsAccount
              - route53domains:AcceptDomainTransferFromAnotherAwsAccount
              - route53domains:DeleteDomain
              - route53domains:DisableDomainTransferLock
              - route53domains:RetrieveDomainAuthCode
              - route53:CreateVPCAssociationAuthorization
              - route53:AssociateVPCWithHostedZone
            Resource: "*"
          - Sid: NoIamNoKeys
            Effect: Deny
            Action:
              - iam:*
              - sts:GetSessionToken
            Resource: "*"
  TcProvisioner:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcProvisioner
      Description: Creates and changes customer Lightsail resources. Assumed by the provisioner function only.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Ref: PoolBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InstanceRoleOfThisStack
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
              StringEquals:
                sts:ExternalId:
                  Fn::Select:
                    - 2
                    - Fn::Split:
                        - /
                        - Ref: AWS::StackId
      Policies:
        - PolicyName: LightsailAdapters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowListOfTheAdapters
                Effect: Allow
                Action:
                  - lightsail:AllocateStaticIp
                  - lightsail:AttachDisk
                  - lightsail:AttachInstancesToLoadBalancer
                  - lightsail:AttachLoadBalancerTlsCertificate
                  - lightsail:AttachStaticIp
                  - lightsail:CreateBucket
                  - lightsail:CreateCertificate
                  - lightsail:CreateContainerService
                  - lightsail:CreateContainerServiceDeployment
                  - lightsail:CreateDisk
                  - lightsail:CreateDiskFromSnapshot
                  - lightsail:CreateDiskSnapshot
                  - lightsail:CreateDistribution
                  - lightsail:CreateInstanceSnapshot
                  - lightsail:CreateInstances
                  - lightsail:CreateInstancesFromSnapshot
                  - lightsail:CreateLoadBalancer
                  - lightsail:CreateLoadBalancerTlsCertificate
                  - lightsail:CreateRelationalDatabase
                  - lightsail:CreateRelationalDatabaseFromSnapshot
                  - lightsail:CreateRelationalDatabaseSnapshot
                  - lightsail:DeleteBucket
                  - lightsail:DeleteBucketAccessKey
                  - lightsail:DeleteCertificate
                  - lightsail:DeleteContainerService
                  - lightsail:DeleteDisk
                  - lightsail:DeleteDiskSnapshot
                  - lightsail:DeleteDistribution
                  - lightsail:DeleteInstance
                  - lightsail:DeleteInstanceSnapshot
                  - lightsail:DeleteLoadBalancer
                  - lightsail:DeleteLoadBalancerTlsCertificate
                  - lightsail:DeleteRelationalDatabase
                  - lightsail:DeleteRelationalDatabaseSnapshot
                  - lightsail:DetachDisk
                  - lightsail:DetachInstancesFromLoadBalancer
                  - lightsail:DetachStaticIp
                  - lightsail:DisableAddOn
                  - lightsail:EnableAddOn
                  - lightsail:GetBucketAccessKeys
                  - lightsail:GetBuckets
                  - lightsail:GetCertificates
                  - lightsail:GetContainerServices
                  - lightsail:GetDisk
                  - lightsail:GetDiskSnapshot
                  - lightsail:GetDistributions
                  - lightsail:GetInstance
                  - lightsail:GetInstancePortStates
                  - lightsail:GetInstanceSnapshot
                  - lightsail:GetKeyPair
                  - lightsail:GetLoadBalancer
                  - lightsail:GetLoadBalancerTlsCertificates
                  - lightsail:GetRelationalDatabase
                  - lightsail:GetRelationalDatabaseParameters
                  - lightsail:GetRelationalDatabaseSnapshot
                  - lightsail:GetStaticIp
                  - lightsail:ImportKeyPair
                  - lightsail:PutInstancePublicPorts
                  - lightsail:RebootInstance
                  - lightsail:RebootRelationalDatabase
                  - lightsail:ReleaseStaticIp
                  - lightsail:ResetDistributionCache
                  - lightsail:SetResourceAccessForBucket
                  - lightsail:StartInstance
                  - lightsail:StartRelationalDatabase
                  - lightsail:StopInstance
                  - lightsail:StopRelationalDatabase
                  - lightsail:TagResource
                  - lightsail:UpdateContainerService
                  - lightsail:UpdateLoadBalancerAttribute
                  - lightsail:UpdateRelationalDatabase
                  - lightsail:UpdateRelationalDatabaseParameters
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      - ap-southeast-1
                      - ap-south-1
                      - us-east-1
              - Sid: ChangeOnlyResourcesTheDatabasePlatformTagged
                Effect: Allow
                Action:
                  - lightsail:AttachCertificateToDistribution
                  - lightsail:DetachCertificateFromDistribution
                  - lightsail:UpdateBucket
                  - lightsail:UpdateDistribution
                  - lightsail:UpdateDistributionBundle
                Resource:
                  - Fn::Sub: arn:aws:lightsail:*:${AWS::AccountId}:Bucket/*
                  - Fn::Sub: arn:aws:lightsail:*:${AWS::AccountId}:Distribution/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      - ap-southeast-1
                      - ap-south-1
                      - us-east-1
                  "Null":
                    aws:ResourceTag/tc:resource: "false"
              - Sid: ExplicitDeny
                Effect: Deny
                Action:
                  - lightsail:DownloadDefaultKeyPair
                  - lightsail:PeerVpc
                  - lightsail:UnpeerVpc
                  - lightsail:ExportSnapshot
                  - lightsail:CreateCloudFormationStack
                  - lightsail:GetInstanceAccessDetails
                Resource: "*"
  TcReader:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcReader
      Description: Read-only Lightsail. Assumed by reader, catalog-sync and reconciler.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Ref: PoolBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InstanceRoleOfThisStack
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
              StringEquals:
                sts:ExternalId:
                  Fn::Select:
                    - 2
                    - Fn::Split:
                        - /
                        - Ref: AWS::StackId
      Policies:
        - PolicyName: LightsailRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GetOnly
                Effect: Allow
                Action:
                  - lightsail:Get*
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      - ap-southeast-1
                      - ap-south-1
                      - us-east-1
              - Sid: NoSecretsNoKeys
                Effect: Deny
                Action:
                  - lightsail:GetInstanceAccessDetails
                  - lightsail:GetRelationalDatabaseMasterUserPassword
                  - lightsail:DownloadDefaultKeyPair
                Resource: "*"
  TcAccessDetails:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcAccessDetails
      Description: Windows password, database master password, bucket access key. Assumed by access-details only.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Ref: PoolBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InstanceRoleOfThisStack
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
              StringEquals:
                sts:ExternalId:
                  Fn::Select:
                    - 2
                    - Fn::Split:
                        - /
                        - Ref: AWS::StackId
      Policies:
        - PolicyName: AccessDetails
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WindowsPasswordOnlyForWindowsInstances
                Effect: Allow
                Action:
                  - lightsail:GetInstanceAccessDetails
                Resource:
                  Fn::Sub: arn:aws:lightsail:*:${AWS::AccountId}:Instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/tc:os: windows
              - Sid: NeverForALinuxOrUntaggedInstance
                Effect: Deny
                Action:
                  - lightsail:GetInstanceAccessDetails
                Resource: "*"
                Condition:
                  StringNotEquals:
                    aws:ResourceTag/tc:os: windows
              - Sid: DatabaseMasterPassword
                Effect: Allow
                Action:
                  - lightsail:GetRelationalDatabaseMasterUserPassword
                Resource:
                  Fn::Sub: arn:aws:lightsail:*:${AWS::AccountId}:RelationalDatabase/*
              - Sid: BucketAccessKey
                Effect: Allow
                Action:
                  - lightsail:CreateBucketAccessKey
                  - lightsail:GetBucketAccessKeys
                Resource:
                  Fn::Sub: arn:aws:lightsail:*:${AWS::AccountId}:Bucket/*
              - Sid: ExplicitDeny
                Effect: Deny
                Action:
                  - lightsail:DownloadDefaultKeyPair
                  - lightsail:PeerVpc
                  - lightsail:UnpeerVpc
                  - lightsail:ExportSnapshot
                  - lightsail:CreateCloudFormationStack
                Resource: "*"
  TcBillingReader:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcBillingReader
      Description: Cost of this account only (a member account sees only its own cost). Assumed by the reconciler.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Ref: PoolBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InstanceRoleOfThisStack
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
              StringEquals:
                sts:ExternalId:
                  Fn::Select:
                    - 2
                    - Fn::Split:
                        - /
                        - Ref: AWS::StackId
      Policies:
        - PolicyName: CostRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CostAndUsage
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: "*"
  TcDnsProvisioner:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcDnsProvisioner
      Description: Hosted zones, records and domain registrations. Assumed by the provisioner function only.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Ref: DnsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InstanceRoleOfThisStack
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
              StringEquals:
                sts:ExternalId:
                  Fn::Select:
                    - 2
                    - Fn::Split:
                        - /
                        - Ref: AWS::StackId
      Policies:
        - PolicyName: Route53Provisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: HostedZonesAndRecords
                Effect: Allow
                Action:
                  - route53:CreateHostedZone
                  - route53:GetHostedZone
                  - route53:ListHostedZonesByName
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:DeleteHostedZone
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: DomainRegistration
                Effect: Allow
                Action:
                  - route53domains:CheckDomainAvailability
                  - route53domains:GetDomainPrices
                  - route53domains:GetContactReachabilityStatus
                  - route53domains:ListPrices
                  - route53domains:RegisterDomain
                  - route53domains:GetOperationDetail
                  - route53domains:RenewDomain
                  - route53domains:GetDomainDetail
                  - route53domains:ResendContactReachabilityEmail
                  - route53domains:UpdateDomainNameservers
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: ExplicitDeny
                Effect: Deny
                Action:
                  - route53domains:TransferDomain
                  - route53domains:TransferDomainToAnotherAwsAccount
                  - route53domains:AcceptDomainTransferFromAnotherAwsAccount
                  - route53domains:DeleteDomain
                  - route53domains:DisableDomainTransferLock
                  - route53domains:RetrieveDomainAuthCode
                Resource: "*"
  TcDnsReader:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TcDnsReader
      Description: Read-only Route 53 and Route 53 Domains. Assumed by reader, catalog-sync and reconciler.
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Ref: DnsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InstanceRoleOfThisStack
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn:
                  Fn::GetAtt:
                    - InstanceRole
                    - Arn
              StringEquals:
                sts:ExternalId:
                  Fn::Select:
                    - 2
                    - Fn::Split:
                        - /
                        - Ref: AWS::StackId
      Policies:
        - PolicyName: Route53Read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListedReadsOnly
                Effect: Allow
                Action:
                  - route53domains:CheckDomainAvailability
                  - route53domains:GetDomainSuggestions
                  - route53domains:ListPrices
                  - route53domains:GetDomainDetail
                  - route53domains:GetContactReachabilityStatus
                  - route53domains:ListDomains
                  - route53:ListHostedZones
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: TryAWS.now Pro instance. Only the tc-worker service reaches its credentials (IMDS).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TryAwsNowPro
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeTheTcRolesOnly
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/TcProvisioner
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/TcReader
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/TcAccessDetails
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/TcBillingReader
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/TcDnsProvisioner
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/TcDnsReader
              - Sid: MarketplaceLicence
                Effect: Allow
                Action: license-manager:CheckoutLicense
                Resource: "*"
              - Sid: InstallerReadsTheClientSecretsOfThisStack
                Effect: Allow
                Action: cognito-idp:DescribeUserPoolClient
                Resource:
                  Fn::GetAtt:
                    - CustomerPool
                    - Arn
              - Sid: InstallerReadsTheFirstOperator
                Effect: Allow
                Action: cognito-idp:AdminGetUser
                Resource:
                  Fn::GetAtt:
                    - AdminPool
                    - Arn
              - Sid: InvoicePdfs
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: ${InvoicesBucket.Arn}/*
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: InstanceRole
  InvoicesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  InvoicesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: InvoicesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - Fn::GetAtt:
                  - InvoicesBucket
                  - Arn
              - Fn::Sub: ${InvoicesBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
  CustomerPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      DeletionProtection: ACTIVE
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      MfaConfiguration: OPTIONAL
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
  CustomerAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: CustomerPool
      GenerateSecret: true
      WriteAttributes:
        - name
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlowsUserPoolClient: false
      PreventUserExistenceErrors: ENABLED
  CustomerSignUpClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: CustomerPool
      GenerateSecret: true
      WriteAttributes:
        - email
        - name
        - locale
      ReadAttributes:
        - email
        - name
        - locale
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: minutes
      AllowedOAuthFlowsUserPoolClient: false
      PreventUserExistenceErrors: ENABLED
  AdminPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      DeletionProtection: ACTIVE
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      MfaConfiguration: "ON"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
  AdminAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: AdminPool
      GenerateSecret: false
      WriteAttributes: []
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: hours
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: false
      PreventUserExistenceErrors: ENABLED
  FirstOperator:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId:
        Ref: AdminPool
      Username:
        Ref: OperatorEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value:
            Ref: OperatorEmail
        - Name: email_verified
          Value: "true"
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "TryAWS.now Pro: HTTPS and HTTP for everyone, SSH for the operator only"
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (certificate challenge and redirect)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp:
            Ref: OperatorCidr
          Description: SSH from the operator
  PublicAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize:
                Ref: RootVolumeGiB
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
  Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - TcProvisioner
      - TcReader
      - TcAccessDetails
      - TcBillingReader
      - TcDnsProvisioner
      - TcDnsReader
      - FirstOperator
    Properties:
      ImageId:
        Ref: ImageId
      InstanceType:
        Ref: InstanceType
      LaunchTemplate:
        LaunchTemplateId:
          Ref: LaunchTemplate
        Version:
          Fn::GetAtt:
            - LaunchTemplate
            - LatestVersionNumber
      SubnetId:
        Ref: SubnetId
      SecurityGroupIds:
        - Fn::GetAtt:
            - SecurityGroup
            - GroupId
      IamInstanceProfile:
        Ref: InstanceProfile
      KeyName:
        Fn::If:
          - HasKeyName
          - Ref: KeyName
          - Ref: AWS::NoValue
      Tags:
        - Key: Name
          Value: tryawsnow-pro
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              # TryAWS.now Pro first boot (pro/cfn/build-template.mjs). No secret in this script.
              set -euo pipefail
              install -d -m 0700 /root/tc
              cat >/root/tc/answers.env <<'TCEOF'
              TC_PANEL_HOST=${PanelDomain}
              TC_ADMIN_HOST=${AdminDomain}
              TC_ADMIN_ALLOW=${OperatorCidr}
              TC_ACME_EMAIL=${OperatorEmail}
              AWS_REGION=${AWS::Region}
              COGNITO_CUSTOMER_POOL_ID=${CustomerPool}
              COGNITO_CUSTOMER_CLIENT_ID=${CustomerAppClient}
              COGNITO_SIGNUP_CLIENT_ID=${CustomerSignUpClient}
              COGNITO_ADMIN_POOL_ID=${AdminPool}
              COGNITO_ADMIN_CLIENT_ID=${AdminAppClient}
              TC_FIRST_ADMIN_EMAIL=${OperatorEmail}
              TC_FIRST_ADMIN_SUB=
              TC_ACCOUNT_ID=${AWS::AccountId}
              TC_POOL_EXTERNAL_ID=${ExternalId}
              TC_PUBLIC_IP=${PublicAddress}
              TC_INVOICES_BUCKET=${InvoicesBucket}
              WHMCS_URL=
              TCEOF
              chmod 0600 /root/tc/answers.env
              if /usr/local/sbin/tc-install --answers /root/tc/answers.env >/var/log/tc-firstboot.log 2>&1; then
                echo 'tc-firstboot: TryAWS.now Pro is installed' >/dev/console
              else
                echo 'tc-firstboot: install failed, see /var/log/tc-firstboot.log' >/dev/console
              fi
            - ExternalId:
                Fn::Select:
                  - 2
                  - Fn::Split:
                      - /
                      - Ref: AWS::StackId
  PublicAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId:
        Fn::GetAtt:
          - PublicAddress
          - AllocationId
      InstanceId:
        Ref: Instance
Outputs:
  PublicIp:
    Description: Point BOTH domains at this address (DNS A records).
    Value:
      Ref: PublicAddress
  PanelUrl:
    Value:
      Fn::Sub: https://${PanelDomain}
  AdminUrl:
    Value:
      Fn::Sub: https://${AdminDomain}
  InstanceId:
    Value:
      Ref: Instance
  ExternalId:
    Description: The ExternalId of the Tc roles of this install (not a secret).
    Value:
      Fn::Select:
        - 2
        - Fn::Split:
            - /
            - Ref: AWS::StackId
