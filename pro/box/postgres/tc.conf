# PRO-3, PRO-4. Dropped into conf.d of PostgreSQL 16 by the installer (PRO-4). Loopback only: the database is
# never reachable off the box (the Pro decision for R2, JOURNEY PRO-3).
listen_addresses = 'localhost'
port = 5432
password_encryption = scram-sha-256
# TLS even on loopback (R2: the migrator refuses a session without it). The installer generates this
# certificate for localhost and 127.0.0.1; the apps verify it (sslmode=verify-full, sslrootcert).
ssl = on
ssl_cert_file = '/etc/postgresql/16/main/tc-server.crt'
ssl_key_file = '/etc/postgresql/16/main/tc-server.key'
ssl_min_protocol_version = 'TLSv1.3'
max_connections = 60
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
wal_compression = on
log_min_duration_statement = 2000
# Security review H1: no statement text in the log. A role's password is DDL (CREATE/ALTER ROLE), so
# 'ddl' or a failing statement would write it in clear. 'panic' keeps failing statements out too.
log_statement = 'none'
log_min_error_statement = 'panic'
# No parameter values in the log (R14): statements are logged without their bind values.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
