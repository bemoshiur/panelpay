# PRO-3, PRO-4. Replaces pg_hba.conf. Local socket for the postgres superuser (backups, installer) by peer;
# the table owner and the application roles only over loopback TCP with TLS and SCRAM; nothing else.
# TYPE   DATABASE    USER        ADDRESS         METHOD
local    all         postgres                    peer
hostssl  ticoncloud  tc_owner    127.0.0.1/32    scram-sha-256
hostssl  ticoncloud  web_rw      127.0.0.1/32    scram-sha-256
hostssl  ticoncloud  admin_rw    127.0.0.1/32    scram-sha-256
hostssl  ticoncloud  worker_rw   127.0.0.1/32    scram-sha-256
hostssl  ticoncloud  migrator    127.0.0.1/32    scram-sha-256
hostssl  ticoncloud  report_ro   127.0.0.1/32    scram-sha-256
hostssl  ticoncloud  tc_owner    ::1/128         scram-sha-256
hostssl  ticoncloud  web_rw      ::1/128         scram-sha-256
hostssl  ticoncloud  admin_rw    ::1/128         scram-sha-256
hostssl  ticoncloud  worker_rw   ::1/128         scram-sha-256
hostssl  ticoncloud  migrator    ::1/128         scram-sha-256
hostssl  ticoncloud  report_ro   ::1/128         scram-sha-256
