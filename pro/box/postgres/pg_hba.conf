# PRO-3. Replaces pg_hba.conf. Local socket for the postgres superuser (backups, installer) by peer;
# the application roles only over loopback TCP with SCRAM; nothing else.
# TYPE  DATABASE    USER        ADDRESS         METHOD
local   all         postgres                    peer
host    ticoncloud  web_rw      127.0.0.1/32    scram-sha-256
host    ticoncloud  admin_rw    127.0.0.1/32    scram-sha-256
host    ticoncloud  worker_rw   127.0.0.1/32    scram-sha-256
host    ticoncloud  migrator    127.0.0.1/32    scram-sha-256
host    ticoncloud  report_ro   127.0.0.1/32    scram-sha-256
host    ticoncloud  web_rw      ::1/128         scram-sha-256
host    ticoncloud  admin_rw    ::1/128         scram-sha-256
host    ticoncloud  worker_rw   ::1/128         scram-sha-256
host    ticoncloud  migrator    ::1/128         scram-sha-256
host    ticoncloud  report_ro   ::1/128         scram-sha-256
